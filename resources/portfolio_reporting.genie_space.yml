resources:
  genie_spaces:
    portfolio_reporting:
      title: ${var.agent_title}
      description: >-
        Month-end funds under administration, flows and fee revenue by product,
        account type and asset class. Built on governed metric views in the agent's own schema.
      warehouse_id: ${var.warehouse_id}
      # Generated by scripts/prebuild.py from src/genie/portfolio_reporting.geniespace.json
      file_path: ../build/portfolio_reporting.geniespace.json
      parent_path: ${workspace.file_path}
      permissions:
        - level: CAN_RUN
          group_name: ${var.agent_users_group}
        - level: CAN_MANAGE
          group_name: admins   # agent owners / platform team can inspect the prod agent
